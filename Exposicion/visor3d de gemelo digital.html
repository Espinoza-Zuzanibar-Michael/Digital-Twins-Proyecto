<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemelo Digital - Visor 3D</title>
    <!-- Cargamos Three.js (Librería 3D) desde un CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Cargamos Tailwind CSS para darle un diseño moderno al panel -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #121212; display: flex; }
        #canvas-container { flex: 1; height: 100vh; }
        #panel-ui { width: 400px; height: 100vh; background-color: #1e1e1e; border-left: 1px solid #333; display: flex; flex-direction: column; }
    </style>
</head>
<body class="text-white">

    <!-- Aquí vivirá el gráfico 3D -->
    <div id="canvas-container"></div>

    <!-- Panel lateral de control -->
    <div id="panel-ui" class="p-6 overflow-y-auto box-border shadow-2xl">
        <h1 class="text-2xl font-bold text-blue-400 mb-2">Monitor Gemelo 3D</h1>
        <p class="text-gray-400 text-sm mb-6">Pega aquí el JSON generado por la terminal de C++ para sincronizar el estado físico.</p>

        <!-- Caja de texto para pegar el JSON de C++ -->
        <label class="block text-sm font-medium mb-2 text-gray-300">Payload JSON (Salida de C++):</label>
        <textarea id="jsonInput" class="w-full h-32 bg-gray-900 text-green-400 border border-gray-700 rounded-md p-3 font-mono text-sm mb-4 focus:outline-none focus:border-blue-500 shadow-inner">{"rpm_real":2000.0,"temp_ideal":65.0,"temp_real":65.0,"estado_gemelo":"Normal"}</textarea>
        
        <button id="btnSync" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-md transition duration-200 shadow-lg">
            Sincronizar Gemelo
        </button>

        <div id="error-msg" class="hidden mt-2 text-red-500 text-sm font-bold">Error: JSON inválido. Revisa la consola de C++.</div>

        <!-- Tarjeta de telemetría actualizada -->
        <div class="mt-8 bg-gray-800 rounded-lg p-5 border border-gray-700 shadow-md">
            <h2 class="text-lg font-semibold text-gray-200 border-b border-gray-600 pb-2 mb-4">Datos en Tiempo Real</h2>
            
            <div class="grid grid-cols-2 gap-4 mb-4">
                <div>
                    <p class="text-xs text-gray-400 uppercase tracking-wider">RPM Físico</p>
                    <p id="val-rpm" class="text-2xl font-mono text-blue-300">2000</p>
                </div>
                <div>
                    <p class="text-xs text-gray-400 uppercase tracking-wider">Temp. Física</p>
                    <p class="text-2xl font-mono text-yellow-300"><span id="val-temp">65</span>°C</p>
                </div>
            </div>
            
            <div>
                <p class="text-xs text-gray-400 uppercase tracking-wider mb-1">Diagnóstico (C++)</p>
                <div id="val-estado" class="bg-green-900 text-green-300 px-3 py-2 rounded font-semibold text-sm border border-green-700">
                    Normal
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURACIÓN DEL MUNDO 3D (Three.js) ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        // Configurar cámara (ajustada al espacio disponible)
        const aspect = (window.innerWidth - 400) / window.innerHeight;
        const camera = new THREE.PerspectiveCamera(60, aspect, 0.1, 1000);
        camera.position.set(0, 10, 25);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth - 400, window.innerHeight);
        renderer.setClearColor(0x121212, 1);
        container.appendChild(renderer.domElement);

        // --- 2. CREACIÓN DEL MODELO DE LA TURBINA ---
        const turbineGroup = new THREE.Group();

        // Material principal (cambiará de color según C++)
        const mainMaterial = new THREE.MeshPhongMaterial({ 
            color: 0x10b981, // Verde por defecto
            shininess: 100 
        });

        // Eje central (Cilindro)
        const shaftGeo = new THREE.CylinderGeometry(2, 2, 12, 32);
        const shaft = new THREE.Mesh(shaftGeo, mainMaterial);
        shaft.rotation.x = Math.PI / 2; // Acostar el cilindro
        turbineGroup.add(shaft);

        // Aspas (Cajas)
        const bladeGeo = new THREE.BoxGeometry(1.5, 12, 0.5);
        const bladeMat = new THREE.MeshPhongMaterial({ color: 0x888888, shininess: 50 });
        
        for(let i = 0; i < 4; i++) {
            const blade = new THREE.Mesh(bladeGeo, bladeMat);
            // Distribuir las 4 aspas
            blade.rotation.z = (Math.PI / 2) * i;
            blade.position.y = Math.sin((Math.PI / 2) * i) * 6;
            blade.position.x = Math.cos((Math.PI / 2) * i) * 6;
            turbineGroup.add(blade);
        }

        scene.add(turbineGroup);

        // Luces
        const ambientLight = new THREE.AmbientLight(0x404040, 1.5); // Luz suave
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // Estado interno de la simulación
        let currentRpm = 2000;

        // Bucle de renderizado (Corre 60 veces por segundo)
        function animate() {
            requestAnimationFrame(animate);
            
            // Hacer que la turbina gire basándose en las RPM
            // Se divide por un factor para que la velocidad sea visible en pantalla
            turbineGroup.rotation.z -= (currentRpm * 0.0005);
            
            renderer.render(scene, camera);
        }
        animate(); // Iniciar animación

        // --- 3. CONEXIÓN CON EL USUARIO (Pegar el JSON) ---
        document.getElementById('btnSync').addEventListener('click', function() {
            const inputTxt = document.getElementById('jsonInput').value;
            const errorMsg = document.getElementById('error-msg');
            const estadoUI = document.getElementById('val-estado');

            try {
                errorMsg.classList.add('hidden'); // Ocultar error
                
                // Convertir el texto a un objeto JavaScript
                const data = JSON.parse(inputTxt);
                
                // Actualizar las variables del gráfico 3D
                currentRpm = data.rpm_real;
                
                // Actualizar los textos de la tarjeta
                document.getElementById('val-rpm').innerText = data.rpm_real;
                document.getElementById('val-temp').innerText = data.temp_real;
                estadoUI.innerText = data.estado_gemelo;

                // CAMBIO DE COLOR E INTERFAZ SEGÚN LA LÓGICA DE C++
                estadoUI.className = "px-3 py-2 rounded font-semibold text-sm border"; // Reset
                
                if (data.estado_gemelo.includes("PELIGRO")) {
                    mainMaterial.color.setHex(0xef4444); // Rojo (tailwind red-500)
                    estadoUI.classList.add("bg-red-900", "text-red-300", "border-red-700");
                } 
                else if (data.estado_gemelo.includes("ALERTA")) {
                    mainMaterial.color.setHex(0xf59e0b); // Naranja (tailwind amber-500)
                    estadoUI.classList.add("bg-yellow-900", "text-yellow-300", "border-yellow-700");
                } 
                else {
                    mainMaterial.color.setHex(0x10b981); // Verde (tailwind emerald-500)
                    estadoUI.classList.add("bg-green-900", "text-green-300", "border-green-700");
                }

            } catch (err) {
                // Si el usuario copia mal la línea, mostramos error
                errorMsg.classList.remove('hidden');
                console.error(err);
            }
        });

        // Hacer la ventana responsiva
        window.addEventListener('resize', () => {
            const newAspect = (window.innerWidth - 400) / window.innerHeight;
            camera.aspect = newAspect;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth - 400, window.innerHeight);
        });
    </script>
</body>
</html>
